services:
  # ─── Backend (Express API) ────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # "development" stage: hot-reload via ts-node + volume mounts
      # Switch to "production" for deployment builds
      target: ${BACKEND_TARGET:-development}
    container_name: book-backend
    restart: unless-stopped
    ports:
      - "4500:3001"
      - "5555:5555"
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Points to local MongoDB on the host (not Docker mongo)
      - DATABASE_URL=mongodb://host.docker.internal:27017/bookstore?directConnection=true
      - NODE_ENV=${NODE_ENV:-development}
      - CORS_ORIGIN=http://localhost:3000
      - FRONTEND_BASE_URL=http://localhost:3000
      - AUTH_GOOGLE_ID=983296584328-0ljv301ovl183i8togdf42ki4oof8i9f.apps.googleusercontent.com
      # SMTP settings are loaded from backend/.env via env_file above
    volumes:
      # Hot-reload: source code mounts over the container's copy
      - ./backend/src:/app/src
      # Hot-reload: Prisma schema so schema changes don't require a full rebuild
      - ./backend/prisma:/app/prisma
      # Persist uploaded files
      - backend_uploads:/app/uploads

  # ─── Frontend (Next.js) ───────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${FRONTEND_TARGET:-development}
    container_name: book-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      # Server-side (used by API routes + next-auth inside the Docker network)
      - BACKEND_URL=http://backend:3001
      # Client-side (read at runtime by Next.js dev server)
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:4500
      - FRONTEND_URL=http://localhost:3000
      # JWT_SECRET is loaded from ./frontend/.env via env_file above
      - AUTH_TRUST_HOST=true
    depends_on:
      - backend
    volumes:
      # Hot-reload: mount source so changes reflect instantly
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

volumes:
  backend_uploads:
